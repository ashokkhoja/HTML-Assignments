Q12. Ordered list uses <ol> and displays items with numbers.
Unordered list uses <ul> and displays items with bullets.
Description list uses <dl>, <dt>, and <dd> to show terms and their descriptions.
Q13. Block-level elements start on a new line and take the available width.
Examples: <div>, <p>.
Inline elements stay in the same line and take only the required width.
Examples: <span>, <a>.
Q14. Semantic HTML elements clearly describe their meaning and purpose.
<header> – Defines the header of a page or section.
<nav> – Contains navigation links.
<main> – Contains the main content.
<footer> – Defines the footer of a page or section.
